<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Sign in</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0f172a);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .card {
        width: 380px;
        padding: 36px 32px;
        text-align: center;
      }
      .logo {
        font-size: 44px;
        width: 84px; height: 84px; line-height: 84px;
        margin: 0 auto 18px;
        border-radius: 22px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        box-shadow: 0 10px 30px rgba(99,102,241,.35);
      }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .sub { color: #94a3b8; font-size: 14px; margin: 0 0 28px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .google {
        background: #fff;
        color: #1f2937;
      }
      .google:hover { background: #f1f5f9; }
      .google:disabled { opacity: .6; cursor: default; }
      .g-icon { width: 20px; height: 20px; }
      .msg { margin-top: 20px; font-size: 13px; min-height: 18px; }
      .msg.err { color: #fca5a5; }
      .msg.ok { color: #86efac; }
      .warn {
        margin-top: 22px;
        font-size: 12.5px;
        color: #fbbf24;
        background: rgba(251,191,36,.08);
        border: 1px solid rgba(251,191,36,.25);
        border-radius: 10px;
        padding: 12px;
        text-align: left;
        line-height: 1.5;
        display: none;
      }
      .spin {
        width: 16px; height: 16px;
        border: 2px solid rgba(0,0,0,.25);
        border-top-color: #1f2937;
        border-radius: 50%;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .foot { margin-top: 26px; font-size: 11px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">∑</div>
      <h1>Shree Shetty's Precalc Tutor</h1>
      <p class="sub">Please sign in to continue</p>

      <button id="btn" class="google">
        <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="btnlabel">Sign in with Google</span>
      </button>

      <div id="msg" class="msg"></div>

      <div id="warn" class="warn">
        <b>⚙️ Setup needed:</b> Google Sign-In isn't configured yet. Ask the
        administrator to add a Google Client ID to <code>config.json</code>
        (see <b>GOOGLE_OAUTH_SETUP.md</b>).
      </div>

      <div class="foot">Your progress is saved privately on this device.</div>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const btnlabel = document.getElementById("btnlabel");
      const msg = document.getElementById("msg");
      const warn = document.getElementById("warn");

      (async () => {
        try {
          const { configured } = await window.authAPI.config();
          if (!configured) warn.style.display = "block";
        } catch (_) {}
      })();

      btn.addEventListener("click", async () => {
        msg.className = "msg";
        msg.textContent = "";
        btn.disabled = true;
        btnlabel.textContent = "Waiting for Google…";
        btn.querySelector(".g-icon").outerHTML = '<span class="spin"></span>';
        try {
          const user = await window.authAPI.signIn();
          msg.className = "msg ok";
          msg.textContent = "Welcome, " + (user.name || user.email) + "!";
          // main process swaps to the app window on success.
        } catch (e) {
          msg.className = "msg err";
          msg.textContent = e.message || "Sign-in failed. Please try again.";
          btn.disabled = false;
          btnlabel.textContent = "Sign in with Google";
        }
      });
    </script>
  </body>
</html>
